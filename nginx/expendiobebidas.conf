# ==============================================================================
# Configuración Nginx para Sistema de Expendio de Bebidas (Debian 13 VM)
# Servidor: 10.10.0.135
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND: www.expendiobebidas.misiones.gov.ar (Puerto 80)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.expendiobebidas.misiones.gov.ar expendiobebidas.misiones.gov.ar 10.10.0.135 _;

    root /var/www/expendiobebidas;
    index index.html;

    client_max_body_size 50M;

    # Compresión Gzip para alto rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Enrutamiento SPA React (Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para llamadas API internas/directas por IP
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Caché optimizada para activos estáticos
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Seguridad: Bloquear acceso a archivos ocultos/sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/expendiobebidas_frontend_error.log warn;
    access_log /var/log/nginx/expendiobebidas_frontend_access.log;
}

# ------------------------------------------------------------------------------
# 2. BACKEND API: api.expendiobebidas.misiones.gov.ar (Puerto 80 -> Proxy 3000)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name api.expendiobebidas.misiones.gov.ar;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras requeridas para WebSockets y Proxy inverso
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts para subidas de archivos pesados (PDFs, documentación)
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Seguridad: Bloquear acceso a archivos ocultos/sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_log /var/log/nginx/expendiobebidas_api_error.log warn;
    access_log /var/log/nginx/expendiobebidas_api_access.log;
}
